
name: Build LISO AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licencas e instalar SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Encontrar ZIP do projeto
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: Nenhum ZIP encontrado na raiz do repositorio."
            ls -la
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"
          mkdir -p projeto
          unzip -o "$ZIP_FILE" -d projeto

      - name: Localizar projeto Android
        run: |
          SETTINGS=$(find projeto -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: O ZIP nao contem settings.gradle."
            find projeto -maxdepth 4 -type f
            exit 1
          fi

          echo "Projeto encontrado em: $(dirname "$SETTINGS")"
          echo "$(dirname "$SETTINGS")" > caminho_projeto.txt

      - name: Compilar APK
        run: |
          cd "$(cat caminho_projeto.txt)"
          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LISO-AI-APK
          path: projeto/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
